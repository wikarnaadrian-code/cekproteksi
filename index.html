<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tes Kesiapan Finansial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF3E9;--card:#FFFDF9;--ink:#14213D;--mut:#6a6470;--a:#A3202B;--soft:#F6DFCB;--line:#EBDAC6;--warn:#B4531F;--ok:#2F6F5E;--sh:0 8px 28px rgba(80,40,20,.07);--edge:#DEC7AC;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a1316;--card:#261c20;--ink:#f4ecea;--mut:#b3a5a8;--a:#ff7078;--soft:#3a2428;--line:#3d2c31;--warn:#f0a070;--ok:#5fbf9f;--sh:0 8px 28px rgba(0,0,0,.3);--edge:#4b383e}}
:root[data-theme=dark]{--bg:#1a1316;--card:#261c20;--ink:#f4ecea;--mut:#b3a5a8;--a:#ff7078;--soft:#3a2428;--line:#3d2c31;--warn:#f0a070;--ok:#5fbf9f;--sh:0 8px 28px rgba(0,0,0,.3);--edge:#4b383e}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,sans-serif;overflow-x:hidden}
.w{max-width:600px;margin:0 auto;padding:0 18px 40px}
header{display:flex;align-items:center;padding:16px 0}
header b{font:700 18px Fraunces,Georgia,serif;display:flex;align-items:center;gap:10px}
.seal{width:30px;height:30px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;font:700 15px serif;box-shadow:0 0 0 4px var(--soft)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.18;margin:0 0 12px}h1{font-size:36px;letter-spacing:-.02em}h2{font-size:26px;letter-spacing:-.01em}h3{font-size:19px}
em{color:var(--a)}
.eb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--a);font-weight:600;margin-bottom:10px}

@media print{.stk,.btn,.lnk,.ib,.back,.md,.toast{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}body{background:var(--bg)}}
input:focus{outline:2px solid var(--a);border-color:transparent}
.err{color:var(--warn);font-size:14px;margin-top:8px;min-height:20px}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--a);transition:width .4s}

.tbar{display:flex;align-items:center;gap:14px;margin:2px 0 8px}.pgw{flex:1;min-width:0}.back{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}.back:active{background:var(--soft)}.back:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.why{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.55;margin:10px 0 0;color:var(--ink)}.why::before{content:"Kenapa angkanya segitu?";display:block;font-weight:700;color:var(--a);margin-bottom:2px}

.tip{background:var(--soft);border-radius:14px;padding:11px 14px;font-size:14px;margin:0 0 16px}.tip b{color:var(--a)}
.hint{font-size:13px;color:var(--mut);margin:-4px 0 6px;line-height:1.4}
.stp{animation:up .4s ease both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.row>span:first-child{flex:1 1 38%;min-width:92px}.row b{text-align:right;flex:0 1 auto}
.note{background:var(--bg);border-left:3px solid var(--a);border-radius:4px 12px 12px 4px;padding:10px 14px;font-size:14px;line-height:1.55;margin:14px 0}
.hero{position:relative;border-radius:28px;padding:34px 22px 26px;margin:6px 0 10px;background:radial-gradient(circle at 92% 6%,rgba(163,32,43,.2),transparent 42%),radial-gradient(circle at 0 100%,var(--soft),transparent 60%),var(--card);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--a);opacity:.1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.chips span{font-size:12px;font-weight:600;background:var(--soft);padding:5px 12px;border-radius:20px}
.gauge{height:12px;background:var(--line);border-radius:12px;margin:14px 0 6px;overflow:hidden}.gauge i{display:block;height:100%;border-radius:12px;background:var(--a)}.gauge.ok i{background:var(--ok)}
ul.b{padding-left:20px;margin:8px 0}ul.b li{margin:6px 0;font-size:15px}
details{border-bottom:1px solid var(--line);padding:14px 0}summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}summary::-webkit-details-marker{display:none}summary::after{content:"+";color:var(--a);font-size:22px;line-height:1;flex:none}details[open]>summary::after{content:"\2212"}details p{margin:10px 0 0;color:var(--mut);font-size:15px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}.pc .tg{font-size:11px;font-weight:600;color:var(--a);background:var(--soft);border-radius:12px;padding:2px 8px;margin-left:6px;white-space:nowrap}.pc .cc{color:var(--ink);font-size:14px}.pc.top{border-color:var(--a)}
.tri{display:block;margin:10px auto 6px;max-width:310px;width:100%}.tri .tx{fill:var(--ink);font:600 13px Inter,sans-serif}.tri .sb{fill:var(--mut);font:600 11px Inter,sans-serif}.tri .tn{fill:var(--ink);font:700 26px Inter,sans-serif}.tri .tm{font-size:13px;font-weight:600;fill:var(--mut)}.pls{transform-origin:160px 158px;animation:pls 2.6s ease-in-out infinite}@keyframes pls{50%{transform:scale(1.22);opacity:.08}}
.tl{display:flex;gap:14px;padding:0 0 16px;position:relative}.tl:not(:last-child)::before{content:"";position:absolute;left:8px;top:20px;bottom:0;width:2px;background:var(--line)}.tl i{flex:none;width:18px;height:18px;border-radius:50%;background:var(--a);margin-top:4px;box-shadow:0 0 0 4px var(--soft)}.tl b{display:block}.tl span{font-size:14px;color:var(--mut)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.cmp>div{background:var(--soft);border-radius:14px;padding:12px}.cmp h3{font-size:16px;margin-bottom:6px}.cmp p{margin:6px 0 0;color:var(--ink);font-size:13px}
.lab{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--a);font-weight:600;margin:22px 0 0}
.pw{text-align:center;font-size:12px;color:var(--mut);margin:34px 0 0}.pw b{color:var(--ink)}
.foot{font-size:12px;color:var(--mut);margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:9;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}
.stk{position:sticky;bottom:0;margin:22px -18px 0;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -10px 14px var(--bg);z-index:5}.stk .btn{margin:0}
.prof{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:6px}.prof .av{flex:none;width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid var(--soft)}.prof a{color:var(--a);font-weight:600;text-decoration:none}.prof .ig{font-size:13px}.prof b{display:block}.prof span:not(.av){display:block;font-size:13px;color:var(--mut)}
details.card{border:1px solid var(--line);padding:16px 18px}.fold .ft{display:block;font:700 19px Fraunces,Georgia,serif;margin-top:4px}.fold[open]>summary{margin-bottom:6px}
.mini{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;line-height:1.4;color:var(--mut)}.mini img,.mini .ini{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}.mini .ini,.prof .ini{display:grid;place-items:center;background:var(--soft);color:var(--a);font-weight:700;font-size:14px}.prof .ini{font-size:20px}.mini b{color:var(--ink)}
.ty{display:flex;gap:14px;align-items:center}.ty svg{flex:none;width:106px;height:100px;margin-left:-6px}.ty h2{margin:2px 0 4px}.lad{display:flex;align-items:center;gap:6px;margin:16px 0 6px}.lad i{flex:1;height:8px;border-radius:8px;background:var(--line)}.lad i.on{background:var(--a);opacity:.55}.lad i.me{background:var(--a);height:16px;box-shadow:0 0 0 4px var(--soft)}.ib{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--a);font:700 15px Georgia,serif;cursor:pointer;display:grid;place-items:center;padding:0}.ib:focus-visible{outline:3px solid var(--a);outline-offset:2px}.md{position:fixed;inset:0;background:rgba(20,10,10,.55);z-index:20;display:grid;place-items:center;padding:18px}.mdc{position:relative;width:100%;max-width:380px;max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px 12px}.mdc h3{margin:0 0 8px}.mr{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px}.mr.me{background:var(--soft)}.mr svg{flex:none;width:52px;height:52px}.mr b{display:block;font-size:15px}.mr span{font-size:13px;color:var(--mut)}.ck{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;margin:0 6px 6px 0;border:1.5px dashed var(--mut);color:var(--mut)}.ck.y{border:1.5px solid var(--ok);background:var(--ok);color:#fff}.card a{color:var(--a);font-weight:600}.card a.btn{color:#fff}
.big{font:700 30px/1.15 Inter,sans-serif;letter-spacing:-.02em;margin:10px 0 2px}.big.sm{font-size:23px}.cap{font-size:13px;color:var(--mut);margin-bottom:12px}.cap b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}.tile small{display:block;font-size:12px;font-weight:600;color:var(--mut)}.tile b{display:block;font-size:17px;line-height:1.25;margin:3px 0 2px}.tile span{display:block;font-size:12px;line-height:1.35;color:var(--mut)}
.dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--mut)}.dt.ok{background:var(--ok)}.dt.mid{background:#E08A2E}.dt.bad{background:var(--a)}.dt.nt{background:none;border:1.5px dashed var(--mut)}
.lg{font-size:12px;color:var(--mut);margin:12px 0 0}.lg i{margin-left:10px}.lg i:first-child{margin-left:0}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st3 small{display:block;font-size:12px;color:var(--mut);line-height:1.3}.st3 b{display:block;font-size:15px;line-height:1.3;margin-top:3px}
.gz{position:relative;margin:4px 0 30px}.gz .gauge{margin:0}.mk{position:absolute;top:-3px;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--mut);white-space:nowrap;text-align:center}.mk i{display:block;width:2px;height:18px;background:var(--ink);margin:0 auto 3px;border-radius:2px}
.tln{display:flex;align-items:center;margin:14px 0 0}.tln>b{flex:none;min-width:38px;height:38px;padding:0 6px;border-radius:19px;background:var(--ink);color:var(--card);display:grid;place-items:center;font-size:14px}.tln>span{flex:1;height:3px;background:var(--a);position:relative}.tln i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--a);color:#fff;font:600 12px Inter,sans-serif;padding:4px 10px;border-radius:20px;white-space:nowrap;font-style:normal}
.tlb{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin:3px 0 12px}
.fx{display:inline-block;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:600;font-size:14px;margin:0 0 12px}
details.mo{border:0;border-top:1px solid var(--line);padding:12px 0 0;margin-top:14px}details.mo>summary{font-size:14px;color:var(--a)}details.mo p{font-size:14px;line-height:1.55}details.mo .note{background:none;border:0;padding:0;margin:10px 0 0;color:var(--mut)}
details .ph,.lead{margin:4px 0 0;color:var(--mut);font-size:14.5px;line-height:1.5}.ph{margin:16px 0 2px;font-weight:600;font-size:14px;color:var(--ink)}.pm{display:block;font-size:12px;font-weight:600;color:var(--a);margin-top:1px}
@media print{details.mo>summary{display:none}}
@media(prefers-reduced-motion:reduce){.pls{animation:none}.stp{animation:none}html{scroll-behavior:auto}}
</style></head><body><div class="w"><header><b><span class="seal" aria-hidden="true"></span>Tes Kesiapan Finansial</b></header><main id="m"></main></div>
<script>
const $=s=>document.querySelector(s),m=$('#m');
const num=v=>+String(v||'').replace(/\D/g,'')||0;
const fmt=e=>{const d=e.target.value.replace(/\D/g,'');e.target.value=d.replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
const f=n=>{n=Math.round(n);if(n>=1e9)return'Rp '+(n/1e9).toFixed(1).replace('.',',').replace(',0','')+' miliar';if(n>=1e6)return'Rp '+(n/1e6>=10?Math.round(n/1e6):(n/1e6).toFixed(1).replace('.',',').replace(',0',''))+' juta';return'Rp '+n.toLocaleString('id-ID')};
const r5=n=>Math.ceil(n/5e7)*5e7,d1=n=>(Math.round(n*10)/10).toString().replace('.',',');
const rg=(a,b)=>{const x=f(a),y=f(b),u=x.split(' ').pop();return x==y?x:/juta|miliar/.test(u)&&y.endsWith(' '+u)?x.slice(0,-u.length-1)+' - '+y.slice(3):x+' - '+y};
const pmt=(F,y)=>{const r=.06/12,k=Math.max(12,Math.round(y*12));return F*r/(Math.pow(1+r,k)-1)};
const has=(a,i)=>Array.isArray(a)&&a.includes(i);
const PRIV='Data Anda tidak dikumpulkan dan tidak disimpan. Semua hitungan terjadi di perangkat Anda sendiri.';
const TG={K:'Konvensional',S:'Syariah',B:'Konven dan Syariah'};
const P={
wm:{n:'PRUWell Medical',t:'B',s:'Asuransi kesehatan murni dengan beberapa pilihan plan sampai Plan Diamond. Mengganti tagihan rawat inap dan tindakan sesuai plan, dengan masa tunggu umum 30 hari (tidak berlaku untuk kecelakaan). Ada keringanan premi hingga 20% untuk masa pertanggungan berikutnya lewat fitur PRUWell. Premi naik mengikuti usia. Usia masuk sampai 75 tahun, dapat diperpanjang sampai usia 99.',c:'Siapa pun yang hanya mengandalkan BPJS atau fasilitas kantor dan ingin pilihan rumah sakit dan kamar yang lebih leluasa.'},
pcb:{n:'PRUCritical Benefit 88 (PCB88)',t:'K',s:'Asuransi jiwa tradisional untuk 61 kondisi kritis tahap akhir, plus manfaat angioplasti 10% uang pertanggungan dan manfaat meninggal dunia sampai usia 88 tahun. Uang pertanggungan dibayar tunai, bebas dipakai untuk pengobatan maupun biaya hidup. Premi berkala mulai Rp300 ribu per bulan, masa tunggu 90 hari.',c:'Yang ingin proteksi penyakit kritis sekaligus ada manfaat di akhir. Jika tidak ada klaim sampai usia 88, 100% uang pertanggungan dibayarkan, sehingga preminya lebih tinggi daripada PCA untuk uang pertanggungan yang sama. Usia masuk 1 sampai 60 tahun.'},
pca:{n:'PRUCritical Amanah (PCA)',t:'S',s:'Asuransi jiwa syariah tradisional dengan perlindungan kondisi kritis sejak tahap awal. Santunan tahap awal 25% dari santunan asuransi, lalu kontribusi dibebaskan setelah klaim tahap awal disetujui. Plan Plus punya manfaat akhir kepesertaan hingga 100% santunan asuransi di usia 85. Kontribusi mulai Rp500 ribu per bulan.',c:'Yang fokus pada manfaat proteksi. Kontribusinya lebih ringan daripada PCB88 untuk santunan yang sama, dan perlindungannya mulai sejak tahap awal. Usia masuk 6 sampai 60 tahun.'},
pkk:{n:'PRUSolusi Kondisi Kritis Syariah',t:'S',s:'Asuransi penyakit kritis syariah berjangka satu tahun yang dapat diperpanjang tiap tahun. Santunan 100% untuk 60 kondisi kritis tahap akhir atau meninggal dunia, plus santunan pemulihan 10% untuk kanker atau bedah organ penting. Kontribusi mulai Rp300 ribu per bulan, masa tunggu 90 hari.',c:'Yang sudah melewati batas usia masuk program penyakit kritis lain. Usia masuk sampai 70 tahun.'},
fut:{n:'PRUFuture',t:'K',s:'Asuransi jiwa tradisional dengan perlindungan sampai usia 100 tahun dan masa bayar premi 5, 10, atau 15 tahun. Ada Plan Waiver (bebas premi jika terdiagnosis kondisi kritis) dan pilihan Rupiah atau USD. Uang pertanggungan mulai Rp500 juta. Usia masuk sampai 70 tahun (Rupiah) atau 55 tahun (USD).',c:'Pencari nafkah yang ingin warisan siap pakai untuk keluarga dengan nilai yang pasti. Untuk usia 20-an, premi Plan Waiver bisa mendekati PRUHeritage Syariah.'},
her:{n:'PRUHeritage Syariah',t:'S',s:'Asuransi jiwa syariah seumur hidup untuk perencanaan warisan. Santunan meninggal dunia 100% santunan asuransi ditambah Booster Proteksi (jika ada), kepesertaan hingga usia 100 tahun, tersedia dalam Rupiah dan USD. Booster Proteksi menambah santunan 10% tiap 5 tahun mulai tahun polis ke-11, sampai maksimal 50%. Santunan mulai Rp100 juta, kontribusi mulai Rp500 ribu per bulan. Usia masuk sampai 70 tahun, tergantung masa bayar.',c:'Yang ingin menyiapkan warisan, termasuk pemilik usaha. Paling terasa jika dimulai sebelum usia 50, karena Booster Proteksi baru berjalan mulai tahun polis ke-11.'},
cin:{n:'PRUCinta',t:'S',s:'Asuransi jiwa syariah dwiguna dengan perlindungan 20 tahun. Jika tidak ada klaim sampai akhir masa kepesertaan, ada manfaat jatuh tempo berupa Dana Nilai Tunai hingga setara 100% kontribusi yang dibayarkan. Kontribusi dibayar 10 tahun, mulai Rp300 ribu per bulan.',c:'Keluarga muda yang butuh uang pertanggungan besar di masa produktif dengan kontribusi terukur.'},
anu:{n:'PRUAnugerah Syariah',t:'S',s:'Asuransi jiwa syariah seumur hidup dengan perlindungan sampai usia 120 tahun. Santunan meninggal 150% sebelum Manfaat Dana Usia Mapan dibayarkan, dan Manfaat Dana Usia Mapan hingga 100% sesuai usia masuk. Kontribusi mulai Rp500 ribu per bulan.',c:'Yang ingin warisan sekaligus dana tunai di usia mapan, sesuai prinsip syariah.'},
map:{n:'PRUMapan',t:'K',s:'Asuransi jiwa tradisional dwiguna. Premi tahunan mulai Rp2,2 juta (usia masuk 19 sampai 29) atau Rp4,4 juta (usia masuk 30 sampai 45). Manfaat Dana Mapan cair 21 kali tiap tahun dari usia 55 sampai 75, dan bisa dipercepat paling cepat usia 45 setelah 11 tahun premi lunas. Tanpa pemeriksaan kesehatan untuk premi tahunan sampai Rp250 juta.',c:'Gen Z dan milenial yang ingin mulai dana pensiun dengan premi terjangkau dan nilai manfaat yang pasti.'},
sp:{n:'PRUSmart Plan',t:'K',s:'Asuransi jiwa tradisional dwiguna dengan manfaat tunai yang pasti. Premi dibayar 6 atau 8 tahun untuk masa pertanggungan 20 tahun, lalu manfaat tunai tahunan cair setelah masa bayar selesai. Premi mulai Rp2 juta per bulan atau Rp22 juta per tahun.',c:'Pekerja dan keluarga menengah ke atas yang ingin dana pensiun atau pendidikan dengan kepastian nilai, bukan naik turun pasar.'},
pros:{n:'PRUProsper',t:'K',s:'Asuransi jiwa tradisional dwiguna berbasis dolar AS dengan manfaat tunai tahunan sejak akhir tahun polis ketiga. Premi dibayar 5 tahun untuk perlindungan 15 tahun, mulai USD2.500 per tahun. Produk baru, ditujukan untuk segmen berpenghasilan di atas sekitar Rp70 juta per bulan.',c:'Yang punya tujuan dalam dolar, misalnya kuliah di luar negeri, dan ingin menyebar mata uang tabungan.'},
cer:{n:'PRUCerah',t:'S',s:'Asuransi jiwa syariah dwiguna untuk dana pendidikan, yang cair lewat penarikan tunai bulanan (30 atau 36 kali) setelah masa tunggu 8 sampai 18 tahun, sesuai plan (PRUCerah atau PRUCerah Plus). Ada manfaat bebas kontribusi jika orang tua meninggal dunia atau mengalami cacat total dan tetap, sesuai ketentuan polis. Usia masuk orang tua 19 sampai 55 tahun, anak 1 sampai 18 tahun. Kontribusi mulai Rp500 ribu per bulan.',c:'Solusi utama dana pendidikan untuk anak usia 10 tahun ke bawah, karena dirancang khusus untuk pendidikan dengan jadwal cair yang jelas.'},
tah:{n:'PRUTahapan Cemerlang',t:'S',s:'Asuransi jiwa syariah dwiguna dengan Manfaat Dana Tahapan hingga 160% dari target dana (untuk masa kepesertaan 18 tahun), cair bertahap di tiap jenjang pendidikan. Kontribusi mulai Rp200 ribu per bulan.',c:'Orang tua yang ingin dana menyesuaikan jadwal masuk SD, SMP, SMA, dan kuliah. Usia masuk orang tua sampai 55 tahun (Plan PRO) atau 45 tahun (Plan MAX).'}};

['Segitiga proteksi',`<p>Kesehatan menanggung biaya berobat, penyakit kritis menggantikan penghasilan saat pemulihan, jiwa melanjutkan penghasilan keluarga. Jika satu sisi kosong, dua sisi lainnya ikut menanggung bebannya. Di bawahnya ada dua fondasi: dana darurat dan investasi, yang dibangun bersamaan.</p>`],

['Asumsi hitungan','<p>Inflasi 5%, imbal hasil tabungan 6% per tahun, biaya pendidikan naik 8% per tahun. Acuan dana darurat mengikuti panduan umum OJK dan perencana keuangan: lajang 3 sampai 6 bulan, menikah 6 sampai 9 bulan, menikah dengan anak 9 sampai 12 bulan, lebih tebal untuk penghasilan tidak tetap. Aset yang tidak mudah dicairkan, seperti rumah tinggal dan kendaraan, tidak dihitung sebagai dana likuid. Ringkasan program bersumber dari situs resmi Prudential Indonesia dan Prudential Syariah per November 2026, dan dapat berubah.</p>']]],
['Tanya jawab',[
['Kapan waktu terbaik membeli asuransi?','Saat masih sehat. Seleksi lebih lancar, premi mengikuti usia saat ini, dan masa tunggu bisa dilewati sebelum benar-benar dibutuhkan.'],
['Apa itu masa tunggu dan masa investigasi klaim?','Masa tunggu adalah periode di awal polis ketika kondisi tertentu belum bisa diklaim, umumnya sekitar 30 hari untuk kesehatan, dan bisa sampai 12 bulan untuk penyakit tertentu. Setelah itu, klaim awal biasanya diperiksa lebih teliti sekitar satu tahun berikutnya. Detail pastinya mengikuti ketentuan polis.'],
['Dana darurat dulu atau asuransi dulu?','Dana darurat adalah fondasi, tetapi risiko sakit tidak menunggu dana darurat penuh. Kumpulkan bertahap sambil memulai proteksi kesehatan dasar dengan premi terkecil yang nyaman.'],
['Lupa manfaat polis sendiri, apakah wajar?','Sangat wajar. Banyak orang tidak ingat detail polisnya. Justru karena itu polis perlu ditinjau berkala dan dirapikan.'],
['Sudah punya BPJS, apakah masih perlu asuransi swasta?','BPJS adalah dasar yang baik, tetapi pilihan kamar, obat, dan rumah sakit ada batasnya. BPJS juga tidak mengganti penghasilan yang hilang selama berobat.'],
['Uang pertanggungan itu apa?','Jumlah uang yang dibayarkan perusahaan asuransi saat risiko yang dipertanggungkan terjadi. Besarnya berbeda untuk setiap orang, tergantung kemampuan dan kebutuhan.'],
['Mengapa asuransi kantor saja tidak cukup?','Asuransi kantor berhenti saat resign, terkena PHK, atau pensiun. Saat itu usia sudah lebih tua dan kondisi kesehatan bisa berubah, sehingga membeli polis baru bisa lebih mahal atau ditolak.'],
['Mengapa klaim bisa ditolak?','Penyebab yang paling umum: kondisi yang sudah ada sebelum polis dan tidak disampaikan, penyakit di luar cakupan, atau klaim di masa tunggu. Karena itu ketentuan polis perlu dibaca dengan teliti sebelum membeli.'],
['Haruskah jujur soal riwayat kesehatan?','Harus. Kejujuran justru melindungi klaim di kemudian hari. Jangan menghindari medical check up demi riwayat yang tampak bersih.'],
['Jika terlambat membayar premi, apakah polis hangus?','Ada masa tenggang pembayaran. Jika terlewat, polis bisa berhenti (lapse) dan proteksinya hilang. Pada unit link, nilai investasi juga bisa tergerus biaya.'],
['Apakah premi kesehatan bisa naik?','Bisa. Premi kesehatan umumnya naik seiring usia dan biaya medis. Pilih premi yang nyaman untuk jangka panjang, bukan hanya bulan pertama.'],
['Apakah produk syariah hanya untuk Muslim?','Tidak. Produk asuransi syariah terbuka untuk siapa saja. Bedanya ada pada cara pengelolaan dananya, yang memakai prinsip tolong-menolong antarpeserta.'],
['Bagaimana proses konsultasinya?','Lewat WhatsApp dan video call gratis 30 menit. Hasil simulasi dikirim dulu, lalu dibahas sesuai kebutuhan dan kenyamanan, tidak ada ikatan apa pun.']]]];
